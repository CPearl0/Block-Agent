plugins {
    id 'java-library'
    id 'idea'
    id 'net.neoforged.gradle.userdev' version '7.1.38'
    id 'com.diffplug.spotless' version '8.1.0'
}

group = mod_group_id
version = mod_version

base {
    archivesName = "${mod_id}-neoforge-${minecraft_version}"
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
    withSourcesJar()
}

repositories {
    mavenCentral()
}

dependencies {
    implementation "net.neoforged:neoforge:${neo_version}"
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

runs {
    configureEach {
        workingDirectory = layout.projectDirectory.dir('run').dir(name)
        systemProperty 'forge.logging.console.level', 'info'
        modSource sourceSets.main
    }
    client { }
}

def modProperties = [
    mod_id: mod_id,
    mod_name: mod_name,
    mod_version: mod_version,
    mod_authors: mod_authors,
    mod_license: mod_license,
    minecraft_version: minecraft_version,
    neo_version: neo_version
]

tasks.named('processResources', ProcessResources).configure {
    inputs.properties(modProperties)
    filesMatching(['META-INF/neoforge.mods.toml', 'pack.mcmeta']) {
        expand(modProperties)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
    options.compilerArgs.addAll(['-Xlint:deprecation', '-Xlint:unchecked'])
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
    testLogging {
        events 'failed', 'skipped'
    }
}

tasks.withType(Jar).configureEach {
    from('LICENSE') {
        into 'META-INF'
    }
    manifest.attributes(
        'Implementation-Title': mod_name,
        'Implementation-Version': mod_version,
        'Implementation-Vendor': mod_authors
    )
}

tasks.withType(AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}

spotless {
    java {
        target 'src/*/java/**/*.java'
        googleJavaFormat('1.28.0').aosp()
        removeUnusedImports()
        forbidWildcardImports()
    }
    format 'misc', {
        target '*.gradle', '*.properties', '*.md', 'docs/**/*.md',
            '.gitignore', '.gitattributes', '.editorconfig', 'LICENSE',
            'src/**/*.json', 'src/**/*.toml', 'src/**/*.mcmeta'
        trimTrailingWhitespace()
        endWithNewline()
    }
}

tasks.named('wrapper', Wrapper).configure {
    gradleVersion = '9.2.1'
    distributionType = Wrapper.DistributionType.BIN
}
